name: nightly

# WHERE THE WORK THE PR GATE NO LONGER PAYS FOR ACTUALLY RUNS.
#
# The PR gate has a hard budget: a pull request's CI must finish inside ten
# minutes of wall clock. Everything trimmed out of `ci.yml` to hold that budget
# is listed here, and the rule is that NOTHING was deleted — it was moved, and a
# reader can see from this one file exactly what the PR run does not cover:
#
#   1. `@extended` e2e specs. Two chat-WS specs wait out the product's own
#      90-second staleness clock (measured 126 s and 90 s in CI — 216 s of a
#      569 s passing suite). They are correct, they are not flaky, and no test
#      trick shortens a timer the product owns. They run here, every night.
#   1b. `@quarantine` e2e specs — EMPTY today; the lane stays armed. NOT the
#      same thing as `@extended`: `@quarantine` marks a spec that is BROKEN and
#      not yet diagnosed, parked here because a permanently-red PR gate teaches
#      people to ignore the gate. Both entries the list has ever had are
#      resolved: `chat-ws-restart-reseeds` left in the v0.6.1 fork integration
#      (fixture fix), and `chat-toggle-focus-leak` (red since run 32700541733)
#      turned out to be a STALE SPEC — it clicked the renderer switch on the
#      desktop chat-active seam, a control that surface deliberately retired —
#      and is a PR gate spec again now that it drives the seam's real
#      affordances.
#   2. The wide `install-smoke` matrix (debian-12 + ubuntu-22.04, and the
#      `port-conflict` scenario) — see the WHY in `install-smoke.yml`, which
#      carries its own `schedule:` trigger for exactly that reason.
#
# `workflow_dispatch` is here so a release manager can run the full picture on
# demand before cutting a tag, rather than waiting for 03:00.

on:
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC daily
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build-server:
    name: server binary (debug, shared by the e2e shards)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable branch
        with:
          toolchain: stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('server/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-e2e-
            ${{ runner.os }}-cargo-
      # Deliberately NOT the binary cache `ci.yml` uses. A nightly run is the
      # place where a stale-cache lie would hide for a whole day, so it pays the
      # honest build every time.
      - name: Build the server binary
        working-directory: server
        run: cargo build --bin supermux-server
      - uses: actions/upload-artifact@v7
        with:
          name: supermux-server-debug
          path: server/target/debug/supermux-server
          retention-days: 1
          if-no-files-found: error

  e2e-full:
    name: e2e (full, incl. @extended — shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    needs: build-server
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
      - uses: actions/download-artifact@v8
        with:
          name: supermux-server-debug
          path: server/target/debug
      - name: Make the server binary executable
        run: chmod +x server/target/debug/supermux-server
      - uses: actions/cache@v6
        with:
          path: web/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('web/bun.lock') }}
          # Exact lockfile match only, no restore-keys: bun (1.3.10, Linux) installing
          # over another lockfile's node_modules drops the nested deps of updated
          # packages (e.g. babel's lru-cache@5), which breaks the build.
      - name: Install web deps
        working-directory: web
        run: bun install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('web/bun.lock') }}
          restore-keys: ${{ runner.os }}-playwright-
      - name: Install Playwright chromium
        working-directory: web
        run: bun x playwright install --with-deps chromium chromium-headless-shell
      # `@slow` and `@needs-claude` stay excluded even here, and for a reason
      # that no schedule can fix: both need the real `claude` CLI on PATH, and a
      # hosted GitHub runner does not have one. They are developer-machine
      # tests. `@extended` and `@quarantine` are NOT excluded — running them is
      # why this file exists. A red nightly is the intended state while a
      # `@quarantine` spec is still broken: that is the alarm, and it should stay
      # loud until someone takes the tag off.
      - name: Full smoke suite (shard ${{ matrix.shard }}/4)
        working-directory: web
        run: bun x playwright test tests/e2e/smoke --shard=${{ matrix.shard }}/4 --grep-invert "@slow|@needs-claude"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: nightly-playwright-report-shard-${{ matrix.shard }}
          path: |
            web/test-results
            web/playwright-report
          retention-days: 7
