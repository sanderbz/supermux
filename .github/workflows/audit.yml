name: audit

# Weekly dependency-vulnerability scan (RustSec for the server, bun audit for
# the web UI). Advisory cadence: new CVEs land independent of pushes, so this
# runs on a schedule rather than per-commit. Manual runs via workflow_dispatch.

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-audit:
    name: cargo audit (RustSec)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable branch
        with:
          toolchain: stable
      - uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-bin
      - name: install cargo-audit
        run: command -v cargo-audit >/dev/null || cargo install cargo-audit --locked
      - run: cargo audit
        working-directory: server

  bun-audit:
    name: bun audit (npm advisories)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      # GHSA-gcqx-w48m-w2h4 (deepmerge <= 4.3.1, low, no patched release): build-only,
      # via vite-plugin-pwa -> workbox-build -> @rollup/plugin-node-resolve; not shipped.
      # GHSA-g3hv-75wg-m249 (minimatch < 11.0.1, moderate) and GHSA-3g3m-2fjr-6pw4
      # (glob 9.0.0-14.0.1, moderate): dev tooling only, via eslint, typescript-eslint,
      # eslint-plugin-jsx-a11y and vite-plugin-pwa -> workbox-build. Not shipped, and the
      # globs come from our own config, never from user input. No release of those
      # packages accepts the patched majors yet, and forcing them breaks jsx-a11y (minimatch 3 API).
      - run: bun audit --ignore=GHSA-gcqx-w48m-w2h4 --ignore=GHSA-g3hv-75wg-m249 --ignore=GHSA-3g3m-2fjr-6pw4
