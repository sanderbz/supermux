name: Browser feedback
on:
  push:
    branches: [feat/browser-feedback]
    paths: ['extension/**', 'web/bun.lock', 'web/src/brand/**', '.github/workflows/browser-feedback.yml']
  pull_request:
    paths: ['extension/**', 'web/bun.lock', 'web/src/brand/**', '.github/workflows/browser-feedback.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browser-feedback-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10
      - name: Install locked browser dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-feedback-chromium-${{ hashFiles('web/bun.lock') }}
      - name: Install Chromium
        working-directory: web
        run: bun x playwright install --with-deps chromium
      - name: Build and test the extension
        working-directory: extension
        run: |
          npm run build
          npm test
      - name: Verify production Chromium geometry
        run: node extension/tests/browser.mjs
      - name: Verify connected Chrome browser control
        run: node extension/tests/control-browser.mjs
      - name: Photograph actual Chrome capture and review
        run: node extension/scripts/showcase.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-feedback-showcase
          path: |
            docs/screenshots/browser-feedback.png
            docs/screenshots/browser-control.png
            extension/preview-overlay.png
          if-no-files-found: warn
          retention-days: 14
