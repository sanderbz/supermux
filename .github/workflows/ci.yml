name: ci

# THE BUDGET: a pull request's CI must finish inside TEN MINUTES of wall clock.
#
# That is an owner requirement, not an aspiration, and it is the reason for
# every trade-off below. Where this workflow was on 2026-08-30 (run
# 33318390754, the last run before this commit) and where the numbers came from:
#
#   job                     before     what it was
#   web                      1.3 min   build + unit + size + lint
#   fmt                      0.1 min   advisory
#   server (check + test)    9.1 min   cache 1.5 / check 0.8 / no-run 1.5 / test 4.7
#   build-server             4.6 min   one debug binary, from scratch every run
#   e2e shard (worst)       13.2 min   19 tests, 12.4 min of them inside playwright
#   ------------------------------------------------------------------------
#   WALL CLOCK              17.9 min   = build-server 4.6 + worst shard 13.2
#
# The critical path was `build-server -> e2e`, and inside e2e the dominant cost
# was not the tests that PASS. Measured per-test from the four shard logs of that
# run: 44 passing tests cost 569 s in total, and 23 FAILING tests cost 1795 s —
# 76% of all e2e time was spent waiting out the 90-second timeout of tests that
# were already broken. So the levers, in the order the numbers justify them:
#
#   1. fix the failures (a first-run overlay from #123 covered `/` in every
#      spec — see `web/tests/e2e/smoke/harness.ts`); the 1795 s largely goes away
#   2. cache the e2e server BINARY, not just its target dir, so `build-server`
#      is seconds on any PR that does not touch `server/` (this one)
#   3. bound what being wrong costs: the per-test timeout is 60 s, measured
#      against a 32 s slowest self-unbudgeted passing test
#   4. move what is slow BY CONSTRUCTION off the PR path into `nightly.yml`
#      (two chat-WS specs that sit out the product's own 90 s clock)
#   5. delete duplicated work rather than coverage (`cargo check --all-targets`
#      was recompiled verbatim by `cargo test --no-run` one step later)
#   6. split the server tests across three runners once they became the critical
#      path — `cargo test` runs 70 binaries strictly in sequence, the lib's 1542
#      unit tests have nothing to say to the 69 integration binaries, and the
#      integration half is sharded again by a DERIVED (never hand-written) list
#
# Measured after (run 33320742166, before the server split): wall clock 8.85 min
# — build-server 1.9, worst e2e shard 6.2, server 8.8. The server split is what
# takes the last job off the ceiling.
#
# NOTE FOR WHOEVER MERGES THIS: `main`'s branch protection requires the CONTEXT
# `server (cargo check + test)`, which no longer exists — the server tests are
# now `server (lib unit tests)` + `server (integration tests 0/2)` + `server
# (integration tests 1/2)`. Protection already requires a second context that no
# job reports (`web (bun build)`), so the required list needs an owner edit
# regardless — see the PR body for the exact call.
#
# Nothing here was dropped silently. Everything moved off the PR gate runs in
# `nightly.yml` (and, for the installer matrix, on `install-smoke.yml`'s own
# schedule), and each move says WHY at its call site.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The frontend gate. Until this wave it ran `bun run build` and NOTHING else:
  # no unit tests, no lint, no size budget, no e2e — grepping the workflows for
  # `test:unit` / `perf:size` / `test:e2e` / `eslint` returned nothing at all.
  # The only thing CI could catch was a file that would not compile, which is
  # how fifteen deterministic e2e failures and a red-by-default smoke suite
  # accumulated without anyone seeing them.
  web:
    name: web (build + unit + size + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
      - uses: actions/cache@v6
        with:
          path: web/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('web/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      # `build` is `tsc -b && vite build`, so this is the typecheck too.
      - run: bun run build
      # The performance budgets (entry chunk, app JS, CSS) plus the non-gating
      # cold-load hero-path report. It reads `dist/`, so it must follow build.
      - name: Performance budget
        run: bun run perf:size
      # After build on purpose: `sw-navigation-route.test.ts` greps the EMITTED
      # service worker, which is the only place the precache-navigation hazard
      # is observable.
      - name: Unit tests
        run: bun test tests/unit --timeout 15000
      # Gated on the error COUNT, not on zero — see scripts/lint-gate.mjs for
      # why a gate that cannot pass on day one is worse than none.
      - name: ESLint (no new errors)
        run: bun run lint:gate

  # ── e2e: one binary, four shards ───────────────────────────────────────────
  #
  # The smoke suite boots a real supermux-server per TEST, so it is dominated by
  # boot cost (~20s each) and cannot use more than one worker on a machine (tmux
  # panes and ports are shared state — that is why `workers: 1` is in
  # playwright.config.ts and must stay there). The two things that WERE wasted
  # are fixed here:
  #
  #   1. the cargo build was inside the e2e job, so any parallelism across specs
  #      would have paid for it once per runner. It is now its own job, built
  #      once, and handed to the shards as an artifact (~25 MB, seconds to
  #      download) — the shards need no rust toolchain and no cargo cache at all;
  #   2. the suite ran as a single ~25-minute serial job. It now runs as four
  #      shards on four runners, each with its own binary and its own `workers:
  #      1`, so the critical path is the build plus the slowest QUARTER of the
  #      suite (~7m) instead of build + 25m.
  #
  # FOUR, not five. Playwright shards by spec FILE, and this suite's files are
  # lumpy (one holds 6 tests, most hold 1). Measured `--list --shard=i/N` on the
  # 73 CI-eligible tests: N=4 gives 19/19/17/18, N=5 gives 20/16/15/14/8 — a
  # fifth runner makes the WORST shard bigger and leaves one nearly idle, so it
  # is slower and costs a machine. Re-measure before changing N.
  #
  # Past that, each shard carries ~1.5-2m of fixed cost (checkout, bun, the
  # artifact, deps, browsers) that does not shard at all. That, not the shard
  # count, is the remaining lever — which is why the browser download is cached.
  #
  # `fail-fast: false` on purpose: one shard going red must not hide the other
  # three, or a "fix" gets shipped against a partial picture.
  build-server:
    name: server binary (debug, shared by the e2e shards)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
      # THE BINARY ITSELF IS THE CACHE ENTRY, not the target dir.
      #
      # Measured on run 33318390754: this job was 4.6 min (3.3 min of it the
      # cargo build) and it sits IN FRONT of all four e2e shards, so it is 4.6
      # min of the PR's 10-minute budget spent before a single test starts. The
      # thing the shards need is one 25 MB executable, and that executable is a
      # pure function of the server sources + the lockfile + the toolchain file
      # + the embedded browser-extension ZIP served by the download endpoint.
      # So key a cache on exactly those and skip cargo entirely on a hit: a PR
      # that touches only `web/` or `.github/` pays seconds instead of minutes.
      #
      # `server/static` is NOT in the key on purpose — this binary is built
      # without a web bundle (the harness serves the app from Vite), so the
      # embedded assets cannot change what the shards run.
      - name: Cache key inputs
        id: bin-key
        run: |
          echo "hash=${{ runner.os }}-e2e-bin-${{ hashFiles('server/src/**', 'server/Cargo.lock', 'server/Cargo.toml', 'server/build.rs', 'server/migrations/**', 'server/rust-toolchain.toml', 'extension/releases/supermux-browser-extension.zip') }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: bin-cache
        with:
          path: server/target/debug/supermux-server
          key: ${{ steps.bin-key.outputs.hash }}
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable branch
        if: steps.bin-cache.outputs.cache-hit != 'true'
        with:
          toolchain: stable
      - uses: actions/cache@v6
        if: steps.bin-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('server/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-e2e-
            ${{ runner.os }}-cargo-
      # The harness boots `server/target/debug/supermux-server`. Debug only —
      # CLAUDE.md forbids --release. No web bundle is embedded on purpose: the
      # harness serves the app from Vite, not from the binary's static assets.
      - name: Build the server binary
        if: steps.bin-cache.outputs.cache-hit != 'true'
        working-directory: server
        run: cargo build --bin supermux-server
      - uses: actions/upload-artifact@v7
        with:
          name: supermux-server-debug
          path: server/target/debug/supermux-server
          retention-days: 1
          # The binary is the whole point; a silent empty upload would turn into
          # four confusing "binary not found" shards.
          if-no-files-found: error

  e2e:
    name: e2e (smoke ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    needs: build-server
    # A shard is ~18 tests. With the first-run fix in place the whole suite's
    # measured passing time is ~570 s minus the 216 s now tagged `@extended`, so
    # a shard is ~1.5 min of tests plus ~1 min of fixed cost. Fifteen minutes is
    # therefore a HANG detector, not a budget: if a shard is still going at 15
    # min something is stuck, and killing it early is what keeps the PR inside
    # ten minutes instead of letting one wedged runner spend twenty-five.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
      # Artifacts do not preserve the executable bit, so restore it explicitly —
      # otherwise every spec fails at spawn with EACCES.
      - uses: actions/download-artifact@v8
        with:
          name: supermux-server-debug
          path: server/target/debug
      - name: Make the server binary executable
        run: chmod +x server/target/debug/supermux-server
      - uses: actions/cache@v6
        with:
          path: web/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('web/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Install web deps
        working-directory: web
        run: bun install --frozen-lockfile
      # Two browser downloads on five runners is the largest remaining fixed cost,
      # and it only changes when Playwright does — so key the cache on the lockfile.
      # A miss is harmless: `playwright install` simply downloads as before.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('web/bun.lock') }}
          restore-keys: ${{ runner.os }}-playwright-
      # `chromium-headless-shell` is a SEPARATE browser download from `chromium`;
      # `sw-lifecycle.spec.ts` pins that channel on purpose (the badge crash it
      # guards reproduces only there — full chromium has the BadgeService binder).
      # `--with-deps` still runs (it installs apt libraries, which the cache above
      # does not cover); the cache saves the browser payloads themselves.
      - name: Install Playwright chromium
        working-directory: web
        run: bun x playwright install --with-deps chromium chromium-headless-shell
      # `@slow` and `@needs-claude` are excluded, and the reason is a property of
      # the runner rather than of the specs: both classes need the real `claude`
      # CLI on PATH (and, for `@slow`, authenticated). `delegate-handoff.spec.ts`
      # (`@slow`) drives TWO REAL Claude sessions through a full turn; the
      # `@needs-claude` resume specs assert an actual `claude --resume <id>`
      # launch. A hosted GitHub runner has no `claude`, so these could only ever
      # be red here — and a permanently-red job is the thing this whole commit
      # exists to stop. They all still run in the un-filtered `bun run
      # test:e2e:smoke` on a developer machine, which is where they can pass.
      #
      # Measured split of the 73 eligible tests: 19 / 19 / 17 / 18 (74 eligible
      # since the quarantine lift below). Retries are no longer global — see
      # playwright.config.ts.
      # THREE exclusions, three different reasons, and keeping them distinct is
      # what stops this list becoming a junk drawer:
      #
      #   `@slow` / `@needs-claude` — CANNOT pass here. Both need the real
      #     `claude` CLI on PATH, and a hosted runner has none.
      #   `@quarantine` — BROKEN, not yet diagnosed. The list is EMPTY today;
      #     the filter stays so the next quarantine is one tag away rather than
      #     one workflow edit away. A quarantined spec runs nightly, where its
      #     failure is the headline rather than background noise on a gate
      #     people have learned to ignore, and the tag comes off in the commit
      #     that fixes it. History, so nobody re-quarantines by pattern-match:
      #     `chat-ws-restart-reseeds` (35 s) left when the v0.6.1 fork
      #     integration fixed its fixture (the stand-in agent drew a bare shell
      #     prompt, so the send guard answered 409); `chat-toggle-focus-leak`
      #     (red since run 32700541733) left when its 180 s timeout turned out
      #     to be a STALE FIRST ACTION — it clicked the renderer switch on the
      #     desktop chat-active seam, a control that surface deliberately
      #     retired — not a product defect; it now drives the seam's real
      #     affordances (`t` hotkey in, switch bar back) and passes in ~7 s.
      #   `@extended` — SLOW BY CONSTRUCTION, and still passing. Measured on run
      # 33318390754, two specs cost 216 s of a 569 s passing-suite:
      # `chat-ws-staleness-ceiling` (126 s) has to sit out the product's real
      # 90-second staleness ceiling and `chat-ws-foreground-redial` (90 s) waits
      # out the same clock. No amount of test cleverness shortens a timer the
      # product owns. They still run every night in `nightly.yml`, unsharded and
      # unfiltered, so the coverage moves rather than disappears.
      - name: Smoke suite (shard ${{ matrix.shard }}/4)
        working-directory: web
        run: bun x playwright test tests/e2e/smoke --shard=${{ matrix.shard }}/4 --grep-invert "@slow|@needs-claude|@extended|@quarantine"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          # Per-shard name: four jobs uploading `playwright-report` would collide.
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            web/test-results
            web/playwright-report
          retention-days: 7

  # ── server tests: TWO jobs, in parallel, because the compile is not the cost ─
  #
  # Measured on run 33320742166: one `server` job was 8.8 min — cache 1.1, `cargo
  # test --no-run` 2.1, `cargo test` 5.1 — and with the e2e path down to 8.1 min
  # it had become the critical path and the whole reason the PR could not fit
  # inside ten minutes. `cargo test` runs the 70 test binaries STRICTLY IN
  # SEQUENCE, and the two halves of that sequence have nothing to say to each
  # other: 1542 lib unit tests (69 s of run time) and 69 integration binaries
  # (~120 s). Splitting them across two runners costs one machine and a second
  # compile of the lib, and turns 8.8 min into two jobs of roughly 4 and 6.
  #
  # NOTHING IS DEMOTED. Every server test that ran on a PR before still runs on
  # a PR. This is a shape change, not a coverage change — which is exactly why it
  # is preferred over the alternative of moving the 69 integration binaries to
  # nightly: they hold the delivery, scope and status-detector guarantees, and
  # a server regression that only nightly catches is a server regression that
  # ships.
  #
  # Raising `--test-threads` or reaching for `cargo nextest` would parallelise
  # inside one runner and look cheaper still — do not. These tests spawn REAL
  # tmux sessions and bind real ports; the isolation that makes them honest is
  # the same isolation that makes them collide when run concurrently on one box.
  # Two runners give parallelism that costs nothing in flakiness.
  server-unit:
    name: server (lib unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # See the note on `server-integration` — dropping debug info is what keeps
      # the lld link inside the runner's memory ceiling.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      # THE WEB BUNDLE IS NOT OPTIONAL HERE, and that was measured the hard way:
      # this step was skipped on the theory that only the INTEGRATION test
      # `tests/static_assets.rs` needs an embedded frontend. Six LIB unit tests
      # in `src/static_assets.rs` need it too — the ones that assert which hosts
      # get the admin token spliced into the served shell (`loopback_host_...`,
      # `quick_tunnel_public_host_...`, and four siblings). With no bundle they
      # have no shell to splice into and panic: 1536 passed, 6 failed on run
      # 33321339241. Twenty seconds of frontend build is the price of that
      # coverage staying in this job.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
      - name: Build + embed web bundle
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build
          rm -rf ../server/static && cp -r dist ../server/static
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable branch
        with:
          toolchain: stable
      # Its own cache key: two jobs sharing one key race on the save and one of
      # them silently wins. Both still fall back to the shared prefix.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: ${{ runner.os }}-cargo-unit-${{ hashFiles('server/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-unit-
            ${{ runner.os }}-cargo-
      - run: cargo test --lib

  # SHARDED IN TWO, AND THE SPLIT IS DERIVED, NEVER WRITTEN DOWN.
  #
  # Measured on run 33321339241: unsharded, this job was 8.3 min — cache 1.2,
  # `--no-run` 1.8, `cargo test --tests` 4.8 — the highest job in a run whose
  # wall clock was 8.35 min. One slow cache restore away from breaking the
  # ten-minute promise, so it gets the same treatment the e2e suite got.
  #
  # The membership rule is `index % 2 == shard`, over `ls tests/*.rs` sorted, in
  # BOTH jobs. That is provably a partition of whatever is on disk: a test file
  # added tomorrow lands in exactly one shard with no one editing this file. A
  # hand-written list of 69 targets would eventually gain a file that is in
  # neither half and runs nowhere — a gate that silently stops gating, which is
  # worse than a slow one. The step prints its own target count and FAILS on an
  # empty list, so a broken glob is loud rather than green.
  server-integration:
    name: server (integration tests ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    env:
      # Drop debug info on the dev profile so the lld link of the many
      # integration test binaries fits in the runner's memory ceiling. Without
      # this, the link of e.g. `status_detector` SIGBUSes (`ld: signal 7`) on
      # GitHub-hosted ubuntu-latest. Tests still run + pass; we only lose
      # file:line in panic backtraces in CI logs, which is fine.
      CARGO_PROFILE_DEV_DEBUG: "0"
      # A runner never reuses an incremental-compilation dir within a job, and
      # `server/target` IS the cache payload — so `incremental/` is hundreds of
      # megabytes that only ever make the restore and the save slower.
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      # tests/static_assets.rs exercises the SPA the binary actually serves, so the
      # web bundle must be built and embedded (rust-embed reads server/static at
      # compile time) BEFORE the cargo steps — mirrors scripts/build.sh's embed step.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
      - name: Build + embed web bundle
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build
          rm -rf ../server/static && cp -r dist ../server/static
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable branch
        with:
          toolchain: stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: ${{ runner.os }}-cargo-int${{ matrix.shard }}-${{ hashFiles('server/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-int${{ matrix.shard }}-
            ${{ runner.os }}-cargo-
      # Debug builds only — CLAUDE.md forbids --release in CI (OOM risk on
      # small hosts and the published binary is built natively by deploy.sh).
      #
      # `cargo check --all-targets` USED TO RUN HERE and was pure duplication:
      # this crate has no benches and no examples (`server/Cargo.toml` declares
      # one `[[bin]]`), so `--all-targets` is exactly lib + bin + the 69 test
      # targets — every one of which the compile below then produces anyway.
      # Measured on run 33318390754 it cost 0.8 min and caught nothing the next
      # step could miss. Removed, not weakened: a type error in any target still
      # fails the build here.
      #
      # The integration binaries; the lib's own unit tests are `server-unit`'s
      # job. Between the two, every `cargo test` target still runs on every PR.
      # (Doctests are neither job's: the crate has three and all three are
      # `ignore`d — `cargo test` reported "0 passed; 3 ignored".)
      #
      # `--test <name>` per target rather than `--tests`, so a shard compiles and
      # links only its own half.
      - name: Select this shard's test targets
        id: targets
        run: |
          set -euo pipefail
          mapfile -t all < <(cd tests && ls *.rs | sed 's/\.rs$//' | sort)
          if [ "${#all[@]}" -eq 0 ]; then
            echo "no integration test targets found under server/tests — refusing to report green" >&2
            exit 1
          fi
          args=""
          for i in "${!all[@]}"; do
            if [ $(( i % 2 )) -eq ${{ matrix.shard }} ]; then
              args="$args --test ${all[$i]}"
            fi
          done
          if [ -z "$args" ]; then
            echo "shard ${{ matrix.shard }} selected 0 of ${#all[@]} targets — the split is broken" >&2
            exit 1
          fi
          echo "shard ${{ matrix.shard }}: $(( $(echo "$args" | wc -w) / 2 )) of ${#all[@]} integration targets"
          echo "args=$args" >> "$GITHUB_OUTPUT"
      - run: cargo test ${{ steps.targets.outputs.args }} --no-run
      - run: cargo test ${{ steps.targets.outputs.args }}

  fmt:
    name: fmt (rustfmt, advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable branch
        with:
          toolchain: stable
          components: rustfmt
      # Advisory only (non-blocking). The codebase is intentionally hand-formatted
      # in a compact style that diverges from stable rustfmt across ~150 files;
      # adopting rustfmt wholesale is a separate, deliberate decision. This step
      # still runs and prints the diff for reference, but a mismatch must NOT fail
      # CI or block merges.
      - run: cargo fmt --all -- --check
        continue-on-error: true
