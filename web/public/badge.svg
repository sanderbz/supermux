<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="112 91 838 838">
  <!--
    supermux notification badge (Android status bar) — rasterized to
    badge-96.png by scripts/build-icons.sh.

    Android draws a notification's `badge` from its ALPHA channel only and
    tints it itself, so a full-colour icon (icon-192.png, a filled tile)
    becomes a solid white square. This is the logo's chevron mark alone, in
    white on transparent, centred in a square with ~8% air — Android's 2dp
    margin on a 24dp icon. Same paths as web/src/brand/logo.svg; only the
    fill (white, no gradient) and the square viewBox differ.
  -->
  <g data-flipped="true" transform="translate(1062 0) scale(-1 1)">
  <g transform="translate(357.67,157.60) scale(0.8166)">
    <path d="M 264.233,306.112 L 2.141,2.480 A 1.50,1.50 0 0 1 3.276,0.000 L 249.297,0.000 A 1.50,1.50 0 0 1 250.450,0.540 L 492.787,291.728 A 18.00,18.00 0 0 1 492.034,315.605 L 400.444,412.530 A 1.50,1.50 0 0 1 399.354,413.000 L 192.899,413.000 A 1.50,1.50 0 0 1 191.674,410.634 L 264.322,307.958 A 1.50,1.50 0 0 0 264.233,306.112 Z" fill="#fff"/>
  </g>
  <g transform="translate(293.97,529.15) scale(0.8166)">
    <path d="M 219.543,405.460 L 0.867,147.024 A 1.50,1.50 0 0 1 0.922,145.025 L 137.556,0.470 A 1.50,1.50 0 0 1 138.646,0.000 L 308.094,0.000 A 1.50,1.50 0 0 1 309.316,2.369 L 225.679,120.044 A 1.50,1.50 0 0 0 225.764,121.890 L 441.897,373.747 A 18.00,18.00 0 0 1 428.455,403.468 L 220.707,405.991 A 1.50,1.50 0 0 1 219.543,405.460 Z" fill="#fff"/>
  </g>
  </g>
</svg>
