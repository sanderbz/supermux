# supermux OOM-protection drop-in — installed by scripts/deploy.sh.
#
# WHY: see the tailscaled drop-in. During the 2026-08-20 host outage sshd was
# also OOM-killed, so even the tailnet-reachable box could not be SSH'd into —
# a manual Strato console reboot was the only way back in. sshd (the OpenSSH
# daemon) must be UN-KILLABLE by the OOM-killer so the operator always has a
# way in under memory pressure.
#
# On this host sshd is socket-activated (ssh.socket, Accept=no): the listener
# is owned by systemd/PID 1 (itself OOM-immune), and ssh.service is the
# on-demand daemon started per the socket. This drop-in makes that daemon
# un-killable whenever it is running. OOMScoreAdjust=-1000 forces oom_score to
# 0 (kernel never selects it). The same file is also installed for
# sshd.service, covering hosts where OpenSSH is a classic always-on daemon.
[Service]
OOMScoreAdjust=-1000
ManagedOOMPreference=omit
