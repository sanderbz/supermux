# supermux OOM-protection drop-in — installed by scripts/deploy.sh.
#
# WHY: 2026-08-20 the whole host fell off the tailnet (100% ping loss + SSH
# timeout, needed a manual console reboot) because a release build + a large
# agent fleet exhausted RAM and the kernel OOM-killer picked tailscaled — the
# NETWORK daemon — so the box went fully offline instead of just losing an
# agent. tailscaled must therefore be UN-KILLABLE by the OOM-killer.
#
# OOMScoreAdjust=-1000 forces this process's oom_score to 0, so the kernel
# never selects it no matter how much memory pressure there is — under RAM
# exhaustion it evicts a build/agent/rustc instead, and the box stays on the
# tailnet + reachable. ManagedOOMPreference=omit tells systemd-oomd to skip it
# too (belt-and-suspenders vs. the kernel-side setting).
[Service]
OOMScoreAdjust=-1000
ManagedOOMPreference=omit
